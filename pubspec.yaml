name: eldermin_teacher_app
description: "Eldermin Teacher - classroom, attendance and communication tools for school teachers."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

# Dependency versions intentionally match eldermin-parent-mobile-app.
# No Firebase / FCM packages: v1 has no client-side push.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  get: ^4.6.6

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.5

  # Secure local storage (JWT)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Formatting
  intl: ^0.19.0

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  table_calendar: ^3.1.2
  flutter_svg: ^2.0.10+1

  # Device / platform
  url_launcher: ^6.3.0
  file_picker: ^8.0.6
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  package_info_plus: ^8.0.0
  # Deep links (reset-password / token+slug auto-login) - wired in Phase 3.
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/auth/
    - assets/icons/
    - assets/fonts/OFL.txt
    - assets/brand/

  # Plus Jakarta Sans (SIL OFL 1.1), bundled - no runtime font fetching.
  # The license text is registered with LicenseRegistry in
  # lib/core/design/font_license.dart.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

# Launcher icon: identical to the Eldermin parent app icon (no badge); source in
# assets/launcher_icon. Re-run with
# `dart run flutter_launcher_icons` after changing it.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/launcher_icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/launcher_icon/icon_foreground.png"

# Native splash: primaryDark background + the reversed logomark (PENDING BRAND
# APPROVAL), identical in light and dark OS mode so there is no white flash.
# The PNGs are exported from assets/brand/logomark_reversed.svg by
#   flutter test tool/brand/export_splash_assets_test.dart
# and regenerated into ios/ + android/ with
#   dart run flutter_native_splash:create
# The logo is EmLogomark.splashHeight (112dp) tall and exactly centred, like the
# Flutter SplashScreen, so the hand-off is seamless.
flutter_native_splash:
  color: "#18457A"
  image: assets/splash/splash_logo.png
  color_dark: "#18457A"
  image_dark: assets/splash/splash_logo.png
  android: true
  ios: true
  android_12:
    color: "#18457A"
    image: assets/splash/splash_android12.png
    icon_background_color: "#18457A"
    color_dark: "#18457A"
    image_dark: assets/splash/splash_android12.png
    icon_background_color_dark: "#18457A"
